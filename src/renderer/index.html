<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge</title>
    <style>
        /* 极简黑白 + 橙。所有颜色只从这里的变量取 */
        :root {
            --bg: #FFFFFF;
            --fg: #111111;
            --muted: #8A8A8A;
            --line: #E8E8E8;
            --soft: #F5F5F5;
            --accent: #FF6A00;
            --accent-soft: rgba(255, 106, 0, 0.12);
            --on-accent: #FFFFFF;
            color-scheme: light;
        }
        html.dark {
            --bg: #111111;
            --fg: #EEEEEE;
            --muted: #7C7C7C;
            --line: #262626;
            --soft: #1B1B1B;
            --accent: #FF6A00;
            --accent-soft: rgba(255, 106, 0, 0.16);
            --on-accent: #111111;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
            font-size: 13px; color: var(--fg); user-select: none;
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
        input, textarea, select { font: inherit; color: var(--fg); }
        .hidden { display: none !important; }
        .drag { -webkit-app-region: drag; }
        .no-drag { -webkit-app-region: no-drag; }

        #app {
            position: relative; height: 100vh; display: flex; flex-direction: column;
            background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
        }

        /* 标题栏：控制按钮常驻右上角 */
        .titlebar { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 6px 0 14px; flex-shrink: 0; }
        .brand { display: flex; align-items: baseline; gap: 8px; }
        .brand-name { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
        .brand-name::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 3px; }
        .brand-date { font-size: 11px; color: var(--muted); }
        .controls { display: flex; align-items: center; gap: 2px; }
        .icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
        .icon-btn:hover { background: var(--soft); color: var(--fg); }
        .icon-btn.on { color: var(--accent); }
        .icon-btn.close:hover { background: var(--accent); color: var(--on-accent); }
        .icon-btn svg { width: 14px; height: 14px; }

        .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* 标签页 */
        .tabs { display: flex; gap: 18px; padding: 0 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
        .tab-btn { padding: 6px 0 8px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .tab-btn:hover { color: var(--fg); }
        .tab-btn.active { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
        .tab-count { font-size: 11px; color: var(--accent); margin-left: 2px; }

        /* 每日条 */
        .daily-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 4px; font-size: 11px; color: var(--muted); flex-shrink: 0; }
        .daily-progress { font-weight: 600; color: var(--fg); margin-right: 8px; }
        .daily-dots { display: inline-flex; gap: 4px; vertical-align: middle; }
        .day-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
        .day-dot.done { background: var(--fg); }
        .day-dot.missed { background: var(--accent); }
        .day-dot.today { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg); }
        .check-time { font-size: 11px; background: transparent; border: none; border-bottom: 1px dashed var(--muted); outline: none; width: 64px; color: var(--fg); }

        /* 列表 */
        .list-wrap { position: relative; flex: 1; min-height: 0; }
        .list { height: 100%; overflow-y: auto; padding: 6px 8px 8px; }
        .list::-webkit-scrollbar, .form-scroll::-webkit-scrollbar { width: 5px; }
        .list::-webkit-scrollbar-thumb, .form-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
        .group-label { font-size: 11px; color: var(--muted); padding: 10px 6px 4px; letter-spacing: .5px; }
        .group-label.q0 { color: var(--accent); font-weight: 600; }

        .task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-radius: 8px; }
        .task:hover { background: var(--soft); }
        .check { padding-top: 1px; cursor: pointer; }
        .check input { position: absolute; opacity: 0; pointer-events: none; }
        .box { display: grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px; }
        .task.done .box { background: var(--fg); border-color: var(--fg); }
        .box svg { width: 11px; height: 11px; color: var(--bg); }
        .task-body { flex: 1; min-width: 0; cursor: text; }
        .task-text { margin: 0; line-height: 1.45; word-break: break-word; user-select: text; }
        .task.done .task-text { color: var(--muted); text-decoration: line-through; }
        /* 时间行：比标签更醒目 */
        .when { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 12px; }
        .w i { font-style: normal; font-size: 10px; color: var(--muted); margin-right: 4px; }
        .w b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
        .w.plan b { font-weight: 500; }
        .w.due.soon b, .w.due.overdue b { color: var(--accent); }
        .w.due.overdue b { font-weight: 700; }
        .task.done .w b { color: var(--muted); font-weight: 400; }
        /* 排序切换 */
        .seg { display: inline-flex; background: var(--soft); border-radius: 6px; padding: 2px; }
        .seg-btn { padding: 3px 10px; border-radius: 4px; font-size: 11px; color: var(--muted); }
        .seg-btn.active { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
        /* 表单日期 + 周几 */
        .dt-row { display: flex; align-items: center; gap: 8px; }
        .dt-row input { flex: 1; min-width: 0; font-weight: 600; }
        .wk { min-width: 30px; font-size: 13px; color: var(--accent); }
        .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; font-size: 11px; color: var(--muted); }
        .meta .due.soon { color: var(--accent); }
        .meta .due.overdue { color: var(--accent); font-weight: 600; }
        .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; line-height: 16px; }
        .tag.imp { background: var(--accent); color: var(--on-accent); }
        .tag.urg { border: 1px solid var(--accent); color: var(--accent); line-height: 14px; }
        .tag.missed { background: var(--accent-soft); color: var(--accent); }
        .delete-btn { opacity: 0; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
        .task:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: var(--accent); background: var(--accent-soft); }
        .delete-btn svg { width: 12px; height: 12px; }
        .edit-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--accent); outline: none; padding: 0 0 2px; }

        .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); }
        .empty p { margin: 2px 0; }
        .empty .sub { font-size: 11px; }

        /* 底部 */
        .footer { padding: 8px 10px 8px; border-top: 1px solid var(--line); flex-shrink: 0; }
        .input-row { display: flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 8px; padding: 2px 4px 2px 10px; }
        .input-row input { flex: 1; background: transparent; border: none; outline: none; padding: 7px 0; }
        .input-row input::placeholder { color: var(--muted); }
        .add-btn { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 17px; line-height: 1; }
        .add-todo-btn { width: 100%; padding: 8px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
        .add-todo-btn:hover, .add-btn:hover { filter: brightness(1.08); }
        .footer-meta { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 2px; font-size: 11px; color: var(--muted); }
        .link-btn:hover { color: var(--accent); }

        /* 待办表单 */
        .form-overlay { position: absolute; inset: 44px 0 0 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
        .form-scroll { flex: 1; overflow-y: auto; padding: 12px 14px; }
        .form-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
        .field { display: block; margin-bottom: 12px; }
        .field > span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .field textarea, .field input, .field select {
            width: 100%; background: var(--soft); border: 1px solid transparent; border-radius: 6px; padding: 7px 8px; outline: none; resize: none;
        }
        .field textarea:focus, .field input:focus, .field select:focus { border-color: var(--accent); }
        .req { color: var(--accent); }
        .toggles { display: flex; gap: 8px; }
        .toggle { flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
        .toggle.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
        .hint { font-size: 10px; color: var(--muted); margin: 5px 0 0; }
        .form-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
        .btn { flex: 1; padding: 8px; border-radius: 8px; }
        .btn.ghost { background: var(--soft); }
        .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }

        /* 动画 */
        .slide-in { animation: slideIn .18s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .fade-out { animation: fadeOut .2s ease-in forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: scale(.97); } }
        .task-complete { animation: pop .3s ease-in-out; }
        @keyframes pop { 50% { transform: scale(1.02); } }
    </style>
</head>
<body>
    <div id="app">
        <header class="titlebar drag">
            <div class="brand">
                <span class="brand-name">Nudge</span>
                <span id="brandDate" class="brand-date"></span>
            </div>
            <div class="controls no-drag">
                <button id="alwaysOnTopBtn" class="icon-btn" title="置顶">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
                </button>
                <button id="themeBtn" class="icon-btn" title="深色 / 浅色">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <button id="compactBtn" class="icon-btn" title="收起 / 展开">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button id="closeBtn" class="icon-btn close" title="隐藏到托盘">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </header>

        <div id="mainContentArea" class="main">
            <nav class="tabs no-drag">
                <button class="tab-btn" data-view="daily">每日常规<span class="tab-count"></span></button>
                <button class="tab-btn" data-view="todo">零碎待办<span class="tab-count"></span></button>
            </nav>

            <div id="dailyBar" class="daily-bar no-drag hidden">
                <span>
                    <span id="dailyProgress" class="daily-progress"></span>
                    <span id="dailyDots" class="daily-dots"></span>
                </span>
                <label title="到这个时间还有没做完的，会弹系统通知">
                    晚间检查 <input id="checkTimeInput" type="time" class="check-time">
                </label>
            </div>

            <div id="todoBar" class="daily-bar no-drag hidden">
                <span>排序</span>
                <div class="seg">
                    <button class="seg-btn" data-sort="time">按时间</button>
                    <button class="seg-btn" data-sort="priority">按重要程度</button>
                </div>
            </div>

            <div class="list-wrap no-drag">
                <div id="tasksList" class="list"></div>
                <div id="emptyState" class="empty hidden">
                    <p id="emptyTitle"></p>
                    <p id="emptySub" class="sub"></p>
                </div>
            </div>

            <footer class="footer no-drag">
                <div id="dailyInputRow" class="input-row">
                    <input id="taskInput" type="text" placeholder="添加每日常规，回车确认">
                    <button id="addBtn" class="add-btn" title="添加">+</button>
                </div>
                <button id="openFormBtn" class="add-todo-btn hidden">+ 添加待办</button>
                <div class="footer-meta">
                    <span id="taskCount">0 项</span>
                    <button id="clearCompletedBtn" class="link-btn hidden">清除已完成</button>
                </div>
            </footer>
        </div>

        <!-- 零碎待办：新建 / 编辑表单 -->
        <div id="todoForm" class="form-overlay no-drag hidden">
            <div class="form-scroll">
                <div id="formTitle" class="form-title">新建待办</div>
                <label class="field">
                    <span>具体事项 <b class="req">*</b></span>
                    <textarea id="fText" rows="3" placeholder="要做什么？"></textarea>
                </label>
                <label class="field">
                    <span>计划时间（打算什么时候做）</span>
                    <div class="dt-row"><input id="fPlanned" type="datetime-local"><b id="fPlannedWk" class="wk"></b></div>
                </label>
                <label class="field">
                    <span>截止时间</span>
                    <div class="dt-row"><input id="fDue" type="datetime-local"><b id="fDueWk" class="wk"></b></div>
                </label>
                <label class="field">
                    <span>截止提醒</span>
                    <select id="fRemind"></select>
                </label>
                <div class="field">
                    <span>优先级（可不选）</span>
                    <div class="toggles">
                        <button type="button" id="fImportant" class="toggle">重要</button>
                        <button type="button" id="fUrgent" class="toggle">紧急</button>
                    </div>
                    <p class="hint">都不选也可以，只记截止时间、到点提醒即可。截止前 24 小时内会自动算作紧急；列表按「重要紧急 → 重要 → 紧急 → 其他」排，同组按截止时间。</p>
                </div>
            </div>
            <div class="form-actions">
                <button id="fCancel" class="btn ghost">取消</button>
                <button id="fSave" class="btn primary">保存（Ctrl+Enter）</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
