name: Build & Release Memo

# 推送 v* 标签（如 v1.5.1）→ 打包 Windows 安装程序和 Mac 的 dmg → 发布到 GitHub Releases
# 手动运行（Actions 页面 Run workflow）只打包和自检，不发布：用来先试 Mac 包
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      # 把打好的 Memo 真的打开跑几个场景；托盘、窗口、全局快捷键有一项没起来就让 CI 失败，不发布
      - name: Smoke test on Windows
        shell: bash
        run: .github/scripts/smoke.sh "dist/win-unpacked/Memo.exe" smoke x64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-smoke
          path: smoke

      - uses: actions/upload-artifact@v4
        with:
          name: memo-win
          # latest.yml + blockmap 是给 Windows 自动更新用的（src/updater.js）
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # 没有苹果开发者账号：只做免费的临时签名（build/after-pack.js），不公证
      - name: Build Mac dmg (arm64 + x64)
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 我们没有 Mac：在这台打包机上把 App 真的打开，跑几个场景并截图，结果作为 mac-smoke 下载
      # 失败（没写出 status.json、托盘 / 窗口 / 快捷键没起来、架构不对）就让 CI 失败，不发布
      - name: Smoke test on macOS (arm64)
        run: .github/scripts/smoke.sh "dist/mac-arm64/Memo.app/Contents/MacOS/Memo" smoke/arm64 arm64

      # 打包机是 Apple 芯片，x64 包靠 Rosetta 转译运行，相当于在 Intel Mac 上打开
      - name: Smoke test on macOS (x64 via Rosetta)
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          .github/scripts/smoke.sh "dist/mac/Memo.app/Contents/MacOS/Memo" smoke/x64 x64

      # 免费临时签名也要能通过结构校验，否则 Mac 会提示「已损坏」
      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Memo.app
          codesign --verify --deep --strict --verbose=2 dist/mac/Memo.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: smoke

      - uses: actions/upload-artifact@v4
        with:
          name: memo-mac
          path: dist/*.dmg

  release:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memo-win
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: memo-mac
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/*.dmg
